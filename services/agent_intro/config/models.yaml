tutorial:
  default_provider: "openai"
  default_model: "gpt-4o-mini"
  mode: "beginner"
  enable_streaming: false
  max_retries: 3
  timeout_seconds: 30
  recommended_providers:
    beginner: "openai"
    local: "ollama"
    free: "huggingface"
  demo_models:
    fast: "openai:gpt-4o-mini"
    capable: "anthropic:claude-3-haiku-20240307"
    local: "ollama:llama3.2"

providers:
  openai:
    default_model: "gpt-4o-mini"
    available_models:
      - "gpt-4o"
      - "gpt-4o-mini"
      - "gpt-3.5-turbo"
    env_var: "OPENAI_API_KEY"
    description: "OpenAI's GPT models"
    settings:
      temperature: 0.7
      max_tokens: 1000

  anthropic:
    default_model: "claude-3-haiku-20240307"
    available_models:
      - "claude-3-5-sonnet-20241022"
      - "claude-3-haiku-20240307"
      - "claude-3-sonnet-20240229"
    env_var: "ANTHROPIC_API_KEY"
    description: "Anthropic's Claude models"
    settings:
      temperature: 0.7
      max_tokens: 1000

  huggingface:
    default_model: "microsoft/DialoGPT-medium"
    available_models:
      - "microsoft/DialoGPT-medium"
      - "meta-llama/Llama-2-7b-chat-hf"
      - "mistralai/Mistral-7B-Instruct-v0.1"
    env_var: "HUGGINGFACE_API_KEY"
    description: "HuggingFace models via Inference API"

  ollama:
    default_model: "llama3.2:latest"
    available_models:
      - "llama3.2:latest"
      - "llama3.3:latest"
      - "mistral"
      - "codellama"
      - "phi3"
    connection:
      host: "localhost"
      port: 11434
    description: "Local Ollama models"

  groq:
    default_model: "llama3-8b-8192"
    available_models:
      - "llama3-8b-8192"
      - "mixtral-8x7b-32768"
      - "gemma-7b-it"
    env_var: "GROQ_API_KEY"
    description: "Groq's fast inference models"

instructions:
  beginner: "You are a friendly AI assistant helping users learn about agents."
  math_tutor: "You are a helpful math assistant. Use tools to perform calculations."
  tool_demo: "You are an assistant with access to various tools. Use them appropriately."